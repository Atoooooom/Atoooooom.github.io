<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>作品 — Photography Portfolio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#0a0a0a;color:#fff}

.header{position:fixed;top:0;width:100%;z-index:100;padding:20px 40px;display:flex;justify-content:space-between;align-items:center;background:rgba(10,10,10,0.95);border-bottom:1px solid rgba(255,255,255,0.06)}
.header h1{font-size:1.2rem;font-weight:300;letter-spacing:4px}
.header h1 a{color:#fff;text-decoration:none}
.header nav{display:flex;align-items:center}
.header nav>a{color:#ccc;text-decoration:none;margin-left:28px;font-size:.9rem;letter-spacing:1px}
.header nav>a:hover{color:#fff}
.nav-dropdown{position:relative;margin-left:28px}
.nav-dropdown>a{color:#ccc;text-decoration:none;font-size:.9rem;letter-spacing:1px;cursor:pointer}
.nav-dropdown>a:hover{color:#fff}
.dd-menu{display:none;position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);background:rgba(20,20,20,0.97);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:6px 0;min-width:140px;backdrop-filter:blur(20px);z-index:200}
.dd-menu::before{content:'';position:absolute;top:-6px;left:50%;transform:translateX(-50%);border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:6px solid rgba(255,255,255,0.1)}
.nav-dropdown:hover .dd-menu,.nav-dropdown.open .dd-menu{display:block}
.dd-menu a{display:block;color:#aaa;text-decoration:none;padding:10px 24px;font-size:.85rem;letter-spacing:1px;transition:all .2s;white-space:nowrap}
.dd-menu a:hover{color:#fff;background:rgba(255,255,255,0.08)}

.work-wrap{padding:120px 40px 60px;max-width:1100px;margin:0 auto}

.author-bar{display:flex;align-items:center;gap:16px;padding-bottom:30px;border-bottom:1px solid rgba(255,255,255,0.06);margin-bottom:36px}
.author-bar .avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,0.1)}
.author-bar .info{flex:1}
.author-bar .name{font-size:1rem;font-weight:400;letter-spacing:.5px}
.author-bar .meta{font-size:.78rem;color:#666;margin-top:3px}
.author-bar .follow-btn{padding:8px 22px;background:transparent;border:1px solid rgba(255,255,255,0.25);color:#ddd;border-radius:24px;cursor:pointer;font-size:.82rem;transition:all .3s;font-family:inherit}
.author-bar .follow-btn:hover{background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.4)}

.work-photo{margin-bottom:32px}
.work-photo img{width:100%;border-radius:6px;display:block;box-shadow:0 8px 40px rgba(0,0,0,0.4)}

.photo-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:40px;padding:16px 0;border-top:1px solid rgba(255,255,255,0.06);border-bottom:1px solid rgba(255,255,255,0.06)}
.photo-nav a{display:flex;align-items:center;gap:8px;color:#888;text-decoration:none;font-size:.88rem;letter-spacing:1px;transition:color .3s;padding:8px 0}
.photo-nav a:hover{color:#fff}
.photo-nav a.disabled{opacity:.2;pointer-events:none;cursor:default}
.photo-nav .counter{color:#555;font-size:.8rem;letter-spacing:1px}
.photo-nav .counter span{color:#888}

.work-title{font-weight:300;font-size:2rem;letter-spacing:2px;margin-bottom:12px;line-height:1.3}
.work-desc{color:#999;font-size:.92rem;line-height:1.9;margin-bottom:32px;max-width:800px}

.action-bar{display:flex;align-items:center;gap:20px;padding:24px 0;border-top:1px solid rgba(255,255,255,0.06);border-bottom:1px solid rgba(255,255,255,0.06);margin-bottom:40px}
.action-btn{display:flex;align-items:center;gap:8px;color:#888;text-decoration:none;font-size:.88rem;cursor:pointer;transition:color .3s;background:none;border:none;font-family:inherit;padding:6px 0}
.action-btn:hover{color:#fff}
.action-btn .icon{font-size:1.15rem}
.action-btn .count{font-size:.78rem;color:#666}

.tags{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:40px}
.tag{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:18px;padding:6px 16px;font-size:.8rem;color:#aaa;letter-spacing:.5px;transition:all .3s;text-decoration:none}
.tag:hover{color:#fff;border-color:rgba(255,255,255,0.2);background:rgba(255,255,255,0.08)}

.related-section{margin-top:60px;padding-top:40px;border-top:1px solid rgba(255,255,255,0.04)}
.related-section h3{font-weight:300;font-size:1.2rem;letter-spacing:2px;margin-bottom:24px}
.related-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.related-card{text-decoration:none;color:inherit;transition:transform .3s}
.related-card:hover{transform:translateY(-4px)}
.related-card img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;margin-bottom:8px}
.related-card .r-title{font-size:.82rem;color:#bbb;letter-spacing:.3px}
.related-card .r-meta{font-size:.7rem;color:#555;margin-top:4px}

.footer{padding:40px 40px 30px;text-align:center;color:#444;font-size:.75rem;letter-spacing:1px;border-top:1px solid rgba(255,255,255,0.05);margin-top:60px}

@media(max-width:768px){
  .header{padding:16px 20px}
  .work-wrap{padding:100px 20px 40px}
  .work-title{font-size:1.5rem}
  .header nav>a,.nav-dropdown{margin-left:14px}
  .header nav>a,.nav-dropdown>a{font-size:.78rem}
  .related-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<header class="header">
  <h1><a href="index.html">Gallery</a></h1>
  <nav>
    <a href="index.html">首页</a>
    <div class="nav-dropdown" onclick="toggleDD(this)">
      <a href="#">作品 ▾</a>
      <div class="dd-menu">
        <a href="gallery.html?category=jiepai">街拍</a>
        <a href="gallery.html?category=chezhan">车展</a>
        <a href="gallery.html?category=mingxing">明星</a>
        <a href="gallery.html?category=mojing">魔镜</a>
        <a href="gallery.html?category=xiuren">秀人</a>
        <a href="gallery.html?category=yunwei">孕味</a>
      </div>
    </div>
    <div class="nav-dropdown" onclick="toggleDD(this)">
      <a href="#">关于 ▾</a>
      <div class="dd-menu">
        <a href="about.html#bio">个人简介</a>
        <a href="about.html#philosophy">摄影理念</a>
        <a href="about.html#gear">设备器材</a>
      </div>
    </div>
    <div class="nav-dropdown" onclick="toggleDD(this)">
      <a href="#">服务 ▾</a>
      <div class="dd-menu">
        <a href="services.html#chezhan">约拍写真</a>
        <a href="services.html#commercial">商业拍摄</a>
        <a href="services.html#retouching">后期修图</a>
        <a href="services.html#workshop">摄影教学</a>
      </div>
    </div>
    <div class="nav-dropdown" onclick="toggleDD(this)">
      <a href="blog.html">日志 ▾</a>
      <div class="dd-menu">
                <a href="blog.html">日志列表</a>
        <a href="blog.html#notes">拍摄手记</a>
        <a href="blog.html#travel">行程记录</a>
        <a href="blog.html#tech">技术分享</a>
      </div>
    </div>
    <div class="nav-dropdown" onclick="toggleDD(this)">
      <a href="#">联系 ▾</a>
      <div class="dd-menu">
        <a href="contact.html#inquiry">合作咨询</a>
        <a href="contact.html#social">社交媒体</a>
      </div>
    </div>
  </nav>
</header>

<div class="work-wrap">

  <div class="author-bar">
    <img class="avatar" src="https://picsum.photos/seed/avatar1/96/96" alt="">
    <div class="info">
      <div class="name">失踪的建文帝</div>
      <div class="meta">独立摄影师 · 武汉</div>
    </div>
    <button class="follow-btn" onclick="this.textContent=this.textContent==='关注'?'已关注':'关注'">+ 关注</button>
  </div>

  <div class="work-photo" id="workPhoto"></div>

  <div class="photo-nav">
    <a id="prevLink" href="#">&#10094; 上一张</a>
    <div class="counter"><span id="currentNum">1</span> / <span id="totalNum">30</span></div>
    <a id="nextLink" href="#">下一张 &#10095;</a>
  </div>

  <h1 class="work-title" id="workTitle">街拍 01</h1>
  <p class="work-desc" id="workDesc">用镜头捕捉那些稍纵即逝的瞬间。光线在魔镜间穿梭，在城市中流淌，在每一个不经意的角落里留下痕迹。</p>

  <div class="action-bar">
    <button class="action-btn" onclick="toggleLike(this)"><span class="icon">&#9825;</span> 喜欢<span class="count" id="likeCount">128</span></button>
    <button class="action-btn"><span class="icon">&#9733;</span> 收藏<span class="count">42</span></button>
    <button class="action-btn" style="margin-left:auto" onclick="shareWork()"><span class="icon">&#8599;</span> 分享</button>
  </div>

  <div class="tags" id="workTags"></div>

  <div class="related-section">
    <h3>同分类更多作品</h3>
    <div class="related-grid" id="relatedGrid"></div>
  </div>

</div>

<div class="footer">&#169; 失踪的建文帝 &#8212; All Rights Reserved</div>

<script>
document.addEventListener('click', function(e) {
  document.querySelectorAll('.nav-dropdown.open').forEach(function(d) {
    if (!d.contains(e.target)) d.classList.remove('open');
  });
});
function toggleDD(el) {
  var w = el.classList.contains('open');
  document.querySelectorAll('.nav-dropdown.open').forEach(function(d) { d.classList.remove('open'); });
  if (!w) el.classList.add('open');
}

var TOTAL = 30;
var catNames = {jiepai:'街拍', chezhan:'车展', mingxing:'明星', mojing:'魔镜', xiuren:'秀人', yunwei:'孕味'};
var seeds    = {jiepai:'land', chezhan:'port', mingxing:'star', mojing:'arch', xiuren:'xiuren'};
var sizes    = [
  [1200,800],[900,600],[700,500],[500,600],[900,550],[600,650],[750,600],[480,600],[850,600],[550,600],
  [680,500],[420,600],[780,600],[520,600],[650,550],[720,640],[580,600],[800,500],[460,620],[700,560],
  [900,600],[540,640],[760,580],[500,560],[820,600],[600,620],[680,560],[440,600],[780,500],[560,640]
];
var tagMap = {
  jiepai:    ['风光','自然','旅行','日出','山水','户外'],
  chezhan:     ['车展','写真','情绪','光影','肖像','艺术'],
  mingxing:       ['明星','红毯','写真','访谈','剧照','时尚'],
  mojing: ['魔镜','空间','线条','几何','结构','设计'],
  xiuren:        ['秀人','城市','长曝光','星空','霓虹','暗调']
};
var descs = {
  jiepai:    '山川湖海，晨昏四季。每一束光都有它的故事，每一片云都在诉说时间。',
  chezhan:     '车展不只是记录外表，而是捕捉灵魂的瞬间。眼神里的情绪，姿态中的张力。',
  mingxing:       '镜头捕捉光影之间，明星闪耀的每一个瞬间。',
  mojing: '魔镜的线条是凝固的音乐，光影是流动的节拍。在钢筋水泥中寻找诗意。',
  xiuren:        '当城市入睡，光影才真正醒来。霓虹、星空、车流——夜是另一番天地。'
};

var params = new URLSearchParams(location.search);
var cat = params.get('category') || 'jiepai';
var idx = parseInt(params.get('index')) || 0;
if (idx < 0) idx = 0;
if (idx >= TOTAL) idx = TOTAL - 1;

var catName = catNames[cat] || '作品';
var seed = seeds[cat] || 'photo';

var sz = sizes[idx];
var img = document.createElement('img');
img.src = 'https://picsum.photos/seed/' + seed + idx + '/' + sz[0] + '/' + sz[1];
img.alt = catName + ' ' + (idx + 1);
document.getElementById('workPhoto').appendChild(img);

document.title = catName + ' · ' + (idx + 1) + ' — 失踪的建文帝';
document.getElementById('workTitle').textContent = catName + ' · ' + String(idx + 1).padStart(2, '0');
document.getElementById('workDesc').textContent = descs[cat] || descs.jiepai;
document.getElementById('currentNum').textContent = idx + 1;
document.getElementById('totalNum').textContent = TOTAL;

var prevLink = document.getElementById('prevLink');
var nextLink = document.getElementById('nextLink');
if (idx <= 0) {
  prevLink.classList.add('disabled');
} else {
  prevLink.href = 'work.html?category=' + cat + '&index=' + (idx - 1);
}
if (idx >= TOTAL - 1) {
  nextLink.classList.add('disabled');
} else {
  nextLink.href = 'work.html?category=' + cat + '&index=' + (idx + 1);
}

var tagsEl = document.getElementById('workTags');
var tags = tagMap[cat] || tagMap.jiepai;
tags.forEach(function(t) {
  var a = document.createElement('a');
  a.className = 'tag';
  a.href = 'gallery.html?category=' + cat;
  a.textContent = t;
  tagsEl.appendChild(a);
});

var relGrid = document.getElementById('relatedGrid');
var shownIdx = {};
shownIdx[idx] = true;
var relCount = 0;
for (var r = 0; r < TOTAL && relCount < 8; r++) {
  if (shownIdx[r]) continue;
  shownIdx[r] = true;
  (function(r) {
    var a = document.createElement('a');
    a.className = 'related-card';
    a.href = 'work.html?category=' + cat + '&index=' + r;
    var imgR = document.createElement('img');
    var szR = sizes[r];
    imgR.src = 'https://picsum.photos/seed/' + seed + r + '/' + szR[0] + '/' + szR[1];
    imgR.alt = '';
    a.appendChild(imgR);
    var t = document.createElement('div');
    t.className = 'r-title';
    t.textContent = catName + ' ' + (r + 1);
    a.appendChild(t);
    var m = document.createElement('div');
    m.className = 'r-meta';
    m.textContent = catName + ' · ' + (r + 1) + ' / ' + TOTAL;
    a.appendChild(m);
    relGrid.appendChild(a);
    relCount++;
  })(r);
}

var liked = false;
function toggleLike(btn) {
  liked = !liked;
  btn.querySelector('.icon').style.color = liked ? '#e74c3c' : '';
  btn.querySelector('.icon').textContent = liked ? '♥' : '♡';
  document.getElementById('likeCount').textContent = liked ? (128 + 1) : 128;
}
function shareWork() {
  if (navigator.share) {
    navigator.share({title: document.title, url: location.href});
  } else {
    prompt('复制链接分享：', location.href);
  }
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowLeft' && idx > 0) {
    location.href = 'work.html?category=' + cat + '&index=' + (idx - 1);
  }
  if (e.key === 'ArrowRight' && idx < TOTAL - 1) {
    location.href = 'work.html?category=' + cat + '&index=' + (idx + 1);
  }
});
</script>
</body>
</html>
