<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>照片</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
    .header {
      padding: 20px 40px; display: flex; justify-content: space-between; align-items: center;
      flex-shrink: 0;
    }
    .back-btn {
      color: #888; text-decoration: none; font-size: 0.9rem; letter-spacing: 1px;
      transition: color 0.3s; border: 1px solid rgba(255,255,255,0.15);
      padding: 8px 20px; border-radius: 24px;
    }
    .back-btn:hover { color: #fff; border-color: rgba(255,255,255,0.4); }
    .category-label { font-weight: 300; font-size: 0.9rem; color: #888; letter-spacing: 2px; }
    .photo-container {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 20px 40px 40px;
    }
    .photo-wrapper { max-width: 1000px; width: 100%; }
    .photo-wrapper img {
      width: 100%; border-radius: 6px; display: block;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .photo-info {
      text-align: center; margin-top: 30px; padding-bottom: 20px;
    }
    .photo-info h2 { font-weight: 300; font-size: 1.4rem; letter-spacing: 2px; margin-bottom: 8px; }
    .photo-info p { color: #777; font-size: 0.85rem; }
    .photo-nav {
      display: flex; justify-content: center; gap: 20px; padding: 20px 40px 50px;
      flex-shrink: 0;
    }
    .photo-nav a {
      color: #888; text-decoration: none; font-size: 0.85rem; letter-spacing: 1px;
      border: 1px solid rgba(255,255,255,0.1); padding: 10px 24px; border-radius: 24px;
      transition: all 0.3s;
    }
    .photo-nav a:hover { color: #fff; border-color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.05); }
    .photo-nav a.disabled { opacity: 0.2; pointer-events: none; }

    @media (max-width: 768px) {
      .photo-container { padding: 16px; }
      .photo-nav { padding: 16px 20px 40px; gap: 12px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <a class="back-btn" id="backBtn" href="gallery.html">← 返回合集</a>
    <div class="category-label" id="catLabel"></div>
  </header>

  <div class="photo-container">
    <div class="photo-wrapper">
      <img id="photoImg" src="" alt="">
    </div>
  </div>

  <div class="photo-info">
    <h2 id="photoTitle">照片标题</h2>
    <p id="photoMeta"></p>
  </div>

  <div class="photo-nav">
    <a id="prevBtn" href="#">← 上一张</a>
    <a id="nextBtn" href="#">下一张 →</a>
  </div>

  <script>
    const categoryNames = {
      landscape: '风景', portrait: '人像', street: '街拍',
      architecture: '建筑', night: '夜景'
    };
    const seeds = { landscape: 'land', portrait: 'port', street: 'str', architecture: 'arch', night: 'night' };
    const sizes = [[800,600],[450,600],[700,600],[500,600],[900,600],[600,600],[750,600],[480,600],[850,600],[550,600],[680,600],[420,600],[780,600],[520,600],[650,600]];
    const TOTAL = 15;

    const params = new URLSearchParams(location.search);
    const cat = params.get('category');
    const idx = parseInt(params.get('index')) || 0;

    const name = categoryNames[cat] || '';
    const seed = seeds[cat] || 'photo';
    document.getElementById('catLabel').textContent = name;
    document.getElementById('backBtn').href = 'gallery.html?category=' + cat;
    document.title = name + ' ' + (idx + 1) + ' — Photography Portfolio';

    const [w, h] = sizes[idx] || [600, 600];
    document.getElementById('photoImg').src = `https://picsum.photos/seed/${seed}${idx + 1}/${w}/${h}`;
    document.getElementById('photoTitle').textContent = name + ' ' + (idx + 1) + ' · 待替换';
    document.getElementById('photoMeta').textContent = '第 ' + (idx + 1) + ' / ' + TOTAL + ' 张';

    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    if (idx <= 0) {
      prevBtn.classList.add('disabled');
    } else {
      prevBtn.href = 'photo.html?category=' + cat + '&index=' + (idx - 1);
    }
    if (idx >= TOTAL - 1) {
      nextBtn.classList.add('disabled');
    } else {
      nextBtn.href = 'photo.html?category=' + cat + '&index=' + (idx + 1);
    }

    // 键盘左右切换
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' && idx > 0) location.href = 'photo.html?category=' + cat + '&index=' + (idx - 1);
      if (e.key === 'ArrowRight' && idx < TOTAL - 1) location.href = 'photo.html?category=' + cat + '&index=' + (idx + 1);
    });
  </script>
</body>
</html>
