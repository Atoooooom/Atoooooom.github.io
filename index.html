<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:'Segoe UI',sans-serif;overflow-x:hidden}

/* ── Header ── */
.header{position:fixed;top:0;width:100%;z-index:100;padding:20px 40px;display:flex;justify-content:space-between;align-items:center;background:rgba(10,10,10,0.95);border-bottom:1px solid rgba(255,255,255,0.06)}
.header h1{font-size:1.2rem;font-weight:300;letter-spacing:4px}
.header h1 a{color:#fff;text-decoration:none}
.header nav{display:flex;align-items:center}
.header nav>a{color:#ccc;text-decoration:none;margin-left:28px;font-size:.9rem;letter-spacing:1px}
.header nav>a:hover{color:#fff}
.nav-dropdown{position:relative;margin-left:28px}
.nav-dropdown>a{color:#ccc;text-decoration:none;font-size:.9rem;letter-spacing:1px;cursor:pointer}
.nav-dropdown>a:hover{color:#fff}
.dd-menu{display:none;position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);background:rgba(20,20,20,0.97);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:6px 0;min-width:140px;backdrop-filter:blur(20px);z-index:200}
.dd-menu::before{content:'';position:absolute;top:-6px;left:50%;transform:translateX(-50%);border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:6px solid rgba(255,255,255,0.1)}
.nav-dropdown:hover .dd-menu,.nav-dropdown.open .dd-menu{display:block}
.dd-menu a{display:block;color:#aaa;text-decoration:none;padding:10px 24px;font-size:.85rem;letter-spacing:1px;transition:all .2s;white-space:nowrap}
.dd-menu a:hover{color:#fff;background:rgba(255,255,255,0.08)}

/* ── Carousel ── */
.carousel{position:relative;width:100%;height:100vh;overflow:hidden}
.carousel-track{display:flex;height:100%;transition:transform 0.8s ease}
.carousel-slide{min-width:100%;height:100%;position:relative}
.carousel-slide img{width:100%;height:100%;object-fit:cover}
.carousel-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.6) 0%,transparent 50%)}
.carousel-caption{position:absolute;bottom:80px;left:60px;z-index:2}
.carousel-caption h2{font-weight:200;font-size:2.6rem;letter-spacing:2px;margin-bottom:10px}
.carousel-caption p{color:rgba(255,255,255,0.7);font-size:.9rem;letter-spacing:1px}
.carousel-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:3;background:rgba(255,255,255,0.1);border:none;color:#fff;width:50px;height:50px;border-radius:50%;cursor:pointer;font-size:1.2rem;transition:background .3s;backdrop-filter:blur(10px)}
.carousel-arrow:hover{background:rgba(255,255,255,0.2)}
.carousel-arrow.left{left:24px}
.carousel-arrow.right{right:24px}
.carousel-dots{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:3}
.carousel-dots span{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,0.3);cursor:pointer;transition:background .3s}
.carousel-dots span.active{background:#fff}
.carousel-progress{position:absolute;bottom:0;left:0;height:2px;background:rgba(255,255,255,0.6);z-index:3;transition:width 0.05s linear}

/* ── Quick Nav Buttons ── */
.quick-nav{display:flex;justify-content:center;gap:14px;padding:40px 40px 10px;flex-wrap:wrap}
.quick-btn{display:inline-block;padding:10px 24px;border:1px solid rgba(255,255,255,0.15);border-radius:30px;color:#ccc;text-decoration:none;font-size:.85rem;letter-spacing:1px;transition:all .3s}
.quick-btn:hover{color:#fff;border-color:rgba(255,255,255,0.4);background:rgba(255,255,255,0.05)}

/* ── Section Title ── */
.section-title{font-weight:300;font-size:1.6rem;letter-spacing:3px;text-align:center;padding:80px 40px 30px}

/* ── Filter Bar ── */
.filter-bar{display:flex;justify-content:center;gap:12px;padding:0 40px 40px;flex-wrap:wrap}
.filter-btn{padding:8px 20px;border:1px solid rgba(255,255,255,0.12);border-radius:20px;background:transparent;color:#888;font-size:.82rem;letter-spacing:1px;cursor:pointer;transition:all .3s}
.filter-btn.active,.filter-btn:hover{color:#fff;border-color:rgba(255,255,255,0.35);background:rgba(255,255,255,0.05)}

/* ── Waterfall Grid ── */
.waterfall{column-count:3;column-gap:14px;max-width:1400px;margin:0 auto;padding:0 40px 80px}
.waterfall-item{break-inside:avoid;margin-bottom:14px;position:relative;border-radius:8px;overflow:hidden;cursor:pointer;transition:transform .3s,box-shadow .3s}
.waterfall-item:hover{transform:translateY(-5px);box-shadow:0 12px 40px rgba(0,0,0,0.5)}
.waterfall-item img{width:100%;display:block;transition:transform .5s}
.waterfall-item:hover img{transform:scale(1.05)}
.waterfall-item .caption{position:absolute;bottom:0;left:0;right:0;padding:60px 16px 14px;background:linear-gradient(transparent,rgba(0,0,0,0.8));font-size:.82rem;color:#ddd;letter-spacing:.5px;opacity:0;transition:opacity .3s}
.waterfall-item:hover .caption{opacity:1}

/* ── Contact Card ── */
.contact-card{text-align:center;padding:0 40px 80px}
.contact-card .qr{display:inline-block;padding:20px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:12px}
.contact-card .qr img{width:140px;height:140px;border-radius:8px}
.contact-card .links{margin-top:24px;display:flex;justify-content:center;gap:20px;flex-wrap:wrap}
.contact-card .links a{color:#888;text-decoration:none;font-size:.85rem;letter-spacing:1px;transition:color .3s}
.contact-card .links a:hover{color:#fff}

/* ── Footer ── */
.footer{padding:30px 40px;text-align:center;color:#444;font-size:.75rem;letter-spacing:1px;border-top:1px solid rgba(255,255,255,0.05);margin-top:60px}

@media(max-width:768px){
  .header{padding:16px 20px}
  .carousel-caption h2{font-size:1.6rem}
  .waterfall{column-count:2;padding:0 20px 60px}
  .quick-nav{padding:30px 20px 10px}
  .header nav>a,.nav-dropdown{margin-left:14px}
  .header nav>a,.nav-dropdown>a{font-size:.78rem}
}
</style>
</head>
<body>

<script>
document.addEventListener('click', function(e) {
  document.querySelectorAll('.nav-dropdown.open').forEach(function(d) {
    if (!d.contains(e.target)) d.classList.remove('open');
  });
});
function toggleDD(el) {
  var w = el.classList.contains('open');
  document.querySelectorAll('.nav-dropdown.open').forEach(function(d) { d.classList.remove('open'); });
  if (!w) el.classList.add('open');
}

/* ── Carousel ── */
var slides = [];
var current = 0, timer = null, progressTimer = null;
var MANIFEST_URL = 'https://cdn.jsdelivr.net/gh/Atoooooom/Atoooooom.github.io@main/manifest.json';

// Caption config: one per slide
var CAPTIONS = [
  { h2: '街拍', p: '城市街头的真实瞬间' },
  { h2: '车展', p: '速度与美学的碰撞' },
  { h2: '魔镜', p: '镜中花，水中月' },
  { h2: '明星', p: '光影中的闪耀时刻' },
  { h2: '精选', p: '更多精彩作品' },
  { h2: '合集', p: '全部作品一览' }
];

function buildCarousel(manifest) {
  var cats = ['jiepai','chezhan','mojing','mingxing'];
  var urls = [];
  for (var i = 0; i < cats.length && i < 4; i++) {
    var cat = cats[i];
    if (manifest[cat]) {
      var pkgs = Object.keys(manifest[cat]);
      if (pkgs.length > 0) {
        var pkg = pkgs[0];
        var imgs = manifest[cat][pkg];
        if (imgs && imgs.length > 0) {
          var u = 'https://cdn.jsdelivr.net/gh/Atoooooom/Atoooooom.github.io@main/images/'
                 + cat + '/' + encodeURIComponent(pkg) + '/' + encodeURIComponent(imgs[0]);
          urls.push(u);
        }
      }
    }
  }
  // Fill to 6 slides with jiepai images
  if (manifest['jiepai']) {
    var jiepaiPkgs = Object.keys(manifest['jiepai']);
    for (var j = 1; urls.length < 6 && j < Math.min(jiepaiPkgs.length, 6); j++) {
      var pkg2 = jiepaiPkgs[j];
      var imgs2 = manifest['jiepai'][pkg2];
      if (imgs2 && imgs2.length > 0) {
        var u2 = 'https://cdn.jsdelivr.net/gh/Atoooooom/Atoooooom.github.io@main/images/jiepai/'
                   + encodeURIComponent(pkg2) + '/' + encodeURIComponent(imgs2[0]);
        urls.push(u2);
      }
    }
  }

  // Build slides
  var track = document.getElementById('track');
  var dots = document.getElementById('dots');
  track.innerHTML = '';
  dots.innerHTML = '';
  slides = urls;
  for (var k = 0; k < slides.length; k++) {
    var div = document.createElement('div');
    div.className = 'carousel-slide';
    div.innerHTML = '<img src="' + slides[k] + '" alt=""><div class="carousel-overlay"></div>'
                 + '<div class="carousel-caption"><h2>' + CAPTIONS[k].h2 + '</h2><p>' + CAPTIONS[k].p + '</p></div>';
    track.appendChild(div);
    var dot = document.createElement('span');
    dot.onclick = (function(idx) { return function() { goSlide(idx); }; })(k);
    dots.appendChild(dot);
  }
  goSlide(0);
}

fetch(MANIFEST_URL).then(function(r) { return r.json(); }).then(buildCarousel).catch(function() {
  // Fallback: use picsum
  console.log('manifest load failed');
});

function goSlide(n) {
  current = (n + slides.length) % slides.length;
  document.getElementById('track').style.transform = 'translateX(-' + (current * 100) + '%)';
  var dots = document.getElementById('dots').children;
  for (var i = 0; i < dots.length; i++) dots[i].className = i === current ? 'active' : '';
  resetProgress();
}
function moveSlide(d) { goSlide(current + d); }
function resetProgress() {
  var bar = document.getElementById('progress');
  bar.style.width = '0%';
  clearInterval(progressTimer);
  progressTimer = setInterval(function() {
    var w = parseFloat(bar.style.width) || 0;
    if (w >= 100) { moveSlide(1); return; }
    bar.style.width = (w + 100/160) + '%';
  }, 50);
}
resetProgress();

/* ── Waterfall Grid (show package covers) ── */
var allItems = [];

function buildGrid(manifest) {
  var bar = document.getElementById('filterBar');
  var grid = document.getElementById('grid');
  // Collect all packages
  var cats = ['jiepai','chezhan','mojing','mingxing'];
  allItems = [];
  cats.forEach(function(cat) {
    if (!manifest[cat]) return;
    Object.keys(manifest[cat]).forEach(function(pkg) {
      var imgs = manifest[cat][pkg];
      if (imgs && imgs.length > 0) {
        allItems.push({ cat: cat, pkg: pkg, img: imgs[0], count: imgs.length });
      }
    });
  });
  // Filter buttons
  bar.innerHTML = '<button class="filter-btn active" data-cat="all">全部</button>'
    + cats.map(function(c) { return '<button class="filter-btn" data-cat="' + c + '">' + {jiepai:'街拍',chezhan:'车展',mojing:'魔镜',mingxing:'明星'}[c] + '</button>'; }).join('');
  bar.querySelectorAll('.filter-btn').forEach(function(btn) {
    btn.onclick = function() {
      bar.querySelectorAll('.filter-btn').forEach(function(b) { b.className = 'filter-btn'; });
      btn.className = 'filter-btn active';
      renderGrid(btn.dataset.cat);
    };
  });
  renderGrid('all');
}

function renderGrid(cat) {
  var grid = document.getElementById('grid');
  grid.innerHTML = '';
  allItems.forEach(function(item) {
    if (cat !== 'all' && item.cat !== cat) return;
    var url = 'https://cdn.jsdelivr.net/gh/Atoooooom/Atoooooom.github.io@main/images/'
            + item.cat + '/' + encodeURIComponent(item.pkg) + '/' + encodeURIComponent(item.img);
    var div = document.createElement('div');
    div.className = 'waterfall-item';
    div.innerHTML = '<img src="' + url + '" alt=""><div class="caption"><span>' + item.pkg + '（' + item.count + '张）</span></div>';
    div.onclick = function() { location.href = 'package.html?category=' + item.cat + '&package=' + encodeURIComponent(item.pkg); };
    grid.appendChild(div);
  });
}

fetch(MANIFEST_URL).then(function(r) { return r.json(); }).then(buildGrid);
</script>
