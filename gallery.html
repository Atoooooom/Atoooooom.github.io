<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>合集 — Photography Portfolio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#0a0a0a;color:#fff}
.header{position:fixed;top:0;width:100%;z-index:100;padding:20px 40px;display:flex;justify-content:space-between;align-items:center;background:rgba(10,10,10,0.95);border-bottom:1px solid rgba(255,255,255,0.06)}
.header h1{font-size:1.2rem;font-weight:300;letter-spacing:4px}
.header h1 a{color:#fff;text-decoration:none}
.header nav{display:flex;align-items:center}
.header nav>a{color:#ccc;text-decoration:none;margin-left:28px;font-size:.9rem;letter-spacing:1px}
.header nav>a:hover{color:#fff}
.nav-dropdown{position:relative;margin-left:28px}
.nav-dropdown>a{color:#ccc;text-decoration:none;font-size:.9rem;letter-spacing:1px;cursor:pointer}
.nav-dropdown>a:hover{color:#fff}
.dd-menu{display:none;position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);background:rgba(20,20,20,0.97);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:6px 0;min-width:140px;backdrop-filter:blur(20px);z-index:200}
.dd-menu::before{content:'';position:absolute;top:-6px;left:50%;transform:translateX(-50%);border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:6px solid rgba(255,255,255,0.1)}
.nav-dropdown:hover .dd-menu,.nav-dropdown.open .dd-menu{display:block}
.dd-menu a{display:block;color:#aaa;text-decoration:none;padding:10px 24px;font-size:.85rem;letter-spacing:1px;transition:all .2s;white-space:nowrap}
.dd-menu a:hover{color:#fff;background:rgba(255,255,255,0.08)}

.page-title{text-align:center;padding:140px 40px 20px;font-weight:200;font-size:2.2rem;letter-spacing:3px}
.back-link{display:inline-block;margin:0 auto 40px;color:#666;text-decoration:none;font-size:.85rem;letter-spacing:1px;transition:color .3s}
.back-link:hover{color:#aaa}
.empty{text-align:center;color:#555;padding:80px 20px;font-size:1rem}

.gallery-grid{column-count:3;column-gap:14px;max-width:1400px;margin:0 auto;padding:0 40px 80px}
.gallery-item{break-inside:avoid;margin-bottom:14px;position:relative;border-radius:8px;overflow:hidden;cursor:pointer;transition:transform .3s,box-shadow .3s}
.gallery-item:hover{transform:translateY(-5px);box-shadow:0 12px 40px rgba(0,0,0,0.5)}
.gallery-item img{width:100%;display:block;transition:transform .5s}
.gallery-item:hover img{transform:scale(1.05)}
.gallery-item .caption{position:absolute;bottom:0;left:0;right:0;padding:60px 16px 14px;background:linear-gradient(transparent,rgba(0,0,0,0.8));font-size:.82rem;color:#ddd;letter-spacing:.5px;opacity:0;transition:opacity .3s}
.gallery-item:hover .caption{opacity:1}

.footer{padding:30px 40px;text-align:center;color:#444;font-size:.75rem;letter-spacing:1px;border-top:1px solid rgba(255,255,255,0.05);margin-top:60px}

@media(max-width:768px){
  .header{padding:16px 20px}
  .page-title{padding:120px 20px 16px;font-size:1.6rem}
  .gallery-grid{padding:0 20px 60px;grid-template-columns:repeat(2,1fr);gap:10px}
  .header nav>a,.nav-dropdown{margin-left:14px}
  .header nav>a,.nav-dropdown>a{font-size:.78rem}
}
</style>
</head>
<body>

<header class="header">
  <h1><a href="index.html">Gallery</a></h1>
  <nav>
    <a href="index.html">首页</a>
    <div class="nav-dropdown" onclick="toggleDD(this)">
      <a href="#">作品 ▾</a>
      <div class="dd-menu">
        <a href="gallery.html?category=jiepai">街拍</a>
        <a href="gallery.html?category=chezhan">车展</a>
        <a href="gallery.html?category=mingxing">明星</a>
        <a href="gallery.html?category=mojing">魔镜</a>
        <a href="gallery.html?category=xiuren">秀人</a>
        <a href="gallery.html?category=yunwei">孕味</a>
      </div>
    </div>
    <div class="nav-dropdown" onclick="toggleDD(this)">
      <a href="#">关于 ▾</a>
      <div class="dd-menu">
        <a href="about.html#bio">个人简介</a>
        <a href="about.html#philosophy">摄影理念</a>
        <a href="about.html#gear">设备器材</a>
      </div>
    </div>
    <div class="nav-dropdown" onclick="toggleDD(this)">
      <a href="#">服务 ▾</a>
      <div class="dd-menu">
        <a href="services.html#chezhan">约拍写真</a>
        <a href="services.html#commercial">商业拍摄</a>
        <a href="services.html#retouching">后期修图</a>
        <a href="services.html#workshop">摄影教学</a>
      </div>
    </div>
    <div class="nav-dropdown" onclick="toggleDD(this)">
      <a href="blog.html">日志 ▾</a>
      <div class="dd-menu">
                <a href="blog.html">日志列表</a>
        <a href="blog.html#notes">拍摄手记</a>
        <a href="blog.html#travel">行程记录</a>
        <a href="blog.html#tech">技术分享</a>
      </div>
    </div>
    <div class="nav-dropdown" onclick="toggleDD(this)">
      <a href="#">联系 ▾</a>
      <div class="dd-menu">
        <a href="contact.html#inquiry">合作咨询</a>
        <a href="contact.html#social">社交媒体</a>
      </div>
    </div>
  </nav>
</header>

<div class="page-title" id="catTitle">合集</div>
<div style="text-align:center"><a class="back-link" href="index.html">&#8592; 返回首页</a></div>

<div class="gallery-grid" id="grid"></div>

<div class="footer">&#169; 失踪的建文帝 &#8212; All Rights Reserved</div>

<script>
document.addEventListener('click', function(e) {
  document.querySelectorAll('.nav-dropdown.open').forEach(function(d) {
    if (!d.contains(e.target)) d.classList.remove('open');
  });
});
function toggleDD(el) {
  var w = el.classList.contains('open');
  document.querySelectorAll('.nav-dropdown.open').forEach(function(d) { d.classList.remove('open'); });
  if (!w) el.classList.add('open');
}

var catNames = {jiepai:'街拍', chezhan:'车展', mingxing:'明星', mojing:'魔镜', xiuren:'秀人', yunwei:'孕味'};
var seeds    = {jiepai:'land', chezhan:'port', mingxing:'star', mojing:'arch', xiuren:'xiuren', yunwei:'port'};
var sizes = [
  [800,600],[450,600],[700,500],[500,600],[900,550],[600,650],[750,600],[480,600],[850,600],[550,600],
  [680,500],[420,600],[780,600],[520,600],[650,550],[720,640],[580,600],[800,500],[460,620],[700,560],
  [900,600],[540,640],[760,580],[500,560],[820,600],[600,620],[680,560],[440,600],[780,500],[560,640]
];
var TOTAL = 30;
var cat = new URLSearchParams(location.search).get('category');
var title = catNames[cat] || '合集';
document.getElementById('catTitle').textContent = title;
document.title = title + '（共 ' + TOTAL + ' 张）— Photography Portfolio';

var seed = seeds[cat] || 'photo';
var grid = document.getElementById('grid');

if (!cat || !seeds[cat]) {
  grid.innerHTML = '<div class="empty">未找到该分类，<a href="index.html" style="color:#aaa">返回首页</a></div>';
} else {
  sizes.forEach(function(s, i) {
    var d = document.createElement('div');
    d.className = 'gallery-item';
    d.innerHTML = '<img src="https://picsum.photos/seed/' + seed + i + '/' + s[0] + '/' + s[1] + '" alt="' + catNames[cat] + ' ' + (i+1) + '"><div class="caption"><span>' + catNames[cat] + ' ' + (i+1) + '</span></div>';
    d.onclick = function() { location.href = 'work.html?category=' + cat + '&index=' + i; };
    grid.appendChild(d);
  });
}
</script>
</body>
</html>
