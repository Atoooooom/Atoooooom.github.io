<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>合集 — Photography Portfolio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#0a0a0a;color:#fff}
.header{position:fixed;top:0;width:100%;z-index:100;padding:20px 40px;display:flex;justify-content:space-between;align-items:center;background:rgba(10,10,10,.95);border-bottom:1px solid rgba(255,255,255,.06)}
.header h1{font-size:1.2rem;font-weight:300;letter-spacing:4px}
.header h1 a{color:#fff;text-decoration:none}
.header nav{display:flex;align-items:center}
.header nav>a{color:#ccc;text-decoration:none;margin-left:28px;font-size:.9rem;letter-spacing:1px}
.header nav>a:hover{color:#fff}
.nav-dropdown{position:relative;margin-left:28px}
.nav-dropdown>a{color:#ccc;text-decoration:none;font-size:.9rem;letter-spacing:1px;cursor:pointer}
.nav-dropdown>a:hover{color:#fff}
.dd-menu{display:none;position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);background:rgba(20,20,20,.97);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:6px 0;min-width:140px;backdrop-filter:blur(20px);z-index:200}
.dd-menu::before{content:'';position:absolute;top:-6px;left:50%;transform:translateX(-50%);border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:6px solid rgba(255,255,255,.1)}
.nav-dropdown:hover .dd-menu,.nav-dropdown.open .dd-menu{display:block}
.dd-menu a{display:block;color:#aaa;text-decoration:none;padding:10px 24px;font-size:.85rem;letter-spacing:1px;transition:all .2s;white-space:nowrap}
.dd-menu a:hover{color:#fff;background:rgba(255,255,255,.08)}

.page-title{padding:120px 40px 40px;text-align:center;font-weight:300;font-size:1.8rem;letter-spacing:3px}
.back-link{display:inline-block;margin-bottom:30px;color:#888;text-decoration:none;font-size:.85rem;letter-spacing:1px;border:1px solid rgba(255,255,255,.15);padding:6px 18px;border-radius:20px;transition:all .3s}
.back-link:hover{color:#fff;border-color:rgba(255,255,255,.3)}

.gallery{padding:20px 40px 80px;max-width:1400px;margin:0 auto}
.gallery-grid{columns:3;column-gap:16px}
.gallery-item{break-inside:avoid;margin-bottom:16px;position:relative;overflow:hidden;border-radius:4px;cursor:pointer;transition:transform .3s}
.gallery-item:hover{transform:translateY(-4px)}
.gallery-item img{width:100%;display:block;transition:transform .5s}
.gallery-item:hover img{transform:scale(1.05)}
.gallery-item .caption{position:absolute;bottom:0;left:0;right:0;padding:20px;background:linear-gradient(to top,rgba(0,0,0,.7),transparent);opacity:0;transition:opacity .3s}
.gallery-item:hover .caption{opacity:1}
.empty{text-align:center;color:#555;padding:80px 40px;font-size:1.1rem}

.footer{padding:30px 40px;text-align:center;color:#444;font-size:.75rem;letter-spacing:1px;border-top:1px solid rgba(255,255,255,.05)}

@media(max-width:768px){
  .gallery-grid{columns:2}
  .gallery{padding:20px}
  .header{padding:16px 20px}
  .page-title{padding:100px 20px 30px;font-size:1.4rem}
  .header nav>a,.nav-dropdown{margin-left:14px}
  .header nav>a,.nav-dropdown>a{font-size:.78rem}
}
@media(max-width:480px){.gallery-grid{columns:1}}
</style>
</head>
<body>

<header class="header">
  <h1><a href="index.html">Gallery</a></h1>
  <nav>
    <a href="index.html">首页</a>
    <div class="nav-dropdown" onclick="toggleDD(this)">
      <a href="#" style="color:#fff">作品 ▾</a>
      <div class="dd-menu">
        <a href="gallery.html?category=landscape">风景</a>
        <a href="gallery.html?category=portrait">人像</a>
        <a href="gallery.html?category=street">街拍</a>
        <a href="gallery.html?category=architecture">建筑</a>
        <a href="gallery.html?category=night">夜景</a>
      </div>
    </div>
    <div class="nav-dropdown" onclick="toggleDD(this)">
      <a href="#">关于 ▾</a>
      <div class="dd-menu">
        <a href="about.html#bio">个人简介</a>
        <a href="about.html#philosophy">摄影理念</a>
        <a href="about.html#gear">设备器材</a>
      </div>
    </div>
    <div class="nav-dropdown" onclick="toggleDD(this)">
      <a href="#">服务 ▾</a>
      <div class="dd-menu">
        <a href="services.html#portrait">约拍写真</a>
        <a href="services.html#commercial">商业拍摄</a>
        <a href="services.html#retouching">后期修图</a>
        <a href="services.html#workshop">摄影教学</a>
      </div>
    </div>
    <div class="nav-dropdown" onclick="toggleDD(this)">
      <a href="#">日志 ▾</a>
      <div class="dd-menu">
        <a href="blog.html#notes">拍摄手记</a>
        <a href="blog.html#travel">行程记录</a>
        <a href="blog.html#tech">技术分享</a>
      </div>
    </div>
    <div class="nav-dropdown" onclick="toggleDD(this)">
      <a href="#">联系 ▾</a>
      <div class="dd-menu">
        <a href="contact.html#inquiry">合作咨询</a>
        <a href="contact.html#social">社交媒体</a>
      </div>
    </div>
  </nav>
</header>

<div class="page-title" id="catTitle">合集</div>
<div style="text-align:center"><a class="back-link" href="index.html">← 返回首页</a></div>

<section class="gallery">
  <div class="gallery-grid" id="grid"></div>
</section>

<div class="footer">© 2024 Photography Portfolio — All Rights Reserved</div>

<script>
document.addEventListener('click',e=>{document.querySelectorAll('.nav-dropdown.open').forEach(d=>{if(!d.contains(e.target))d.classList.remove('open')})});
function toggleDD(el){const w=el.classList.contains('open');document.querySelectorAll('.nav-dropdown.open').forEach(d=>d.classList.remove('open'));if(!w)el.classList.add('open')}

const catNames={landscape:'风景',portrait:'人像',street:'街拍',architecture:'建筑',night:'夜景'};
const seeds={landscape:'land',portrait:'port',street:'str',architecture:'arch',night:'night'};
const sizes=[[800,600],[450,600],[700,600],[500,600],[900,600],[600,600],[750,600],[480,600],[850,600],[550,600],[680,600],[420,600],[780,600],[520,600],[650,600]];
const cat=new URLSearchParams(location.search).get('category');
document.getElementById('catTitle').textContent=catNames[cat]||'合集';
document.title=(catNames[cat]||'合集')+' — Photography Portfolio';

const seed=seeds[cat]||'photo';
const grid=document.getElementById('grid');
if(!cat||!seeds[cat]){grid.innerHTML='<div class="empty">未找到该分类，<a href="index.html" style="color:#aaa">返回首页</a></div>'}
else{sizes.forEach(([w,h],i)=>{const d=document.createElement('div');d.className='gallery-item';d.innerHTML='<img src="https://picsum.photos/seed/'+seed+(i+1)+'/'+w+'/'+h+'" alt="'+catNames[cat]+' '+(i+1)+'"><div class="caption"><span>'+catNames[cat]+' '+(i+1)+'</span></div>';d.onclick=()=>location.href='work.html';grid.appendChild(d)})}
</script>
</body>
</html>
