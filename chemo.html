      'rain-bund': {
        title: '雨后的外滩：如何利用倒影构图',
        date: '2024.03.15', tag: '街拍', section: 'notes',
        cover: 'https://picsum.photos/seed/blog-rain/1200/600',
        body: `
          <p>上海外滩，雨后的夜晚是最迷人的时刻。湿润的地面如同一面巨大的镜子，将浦江两岸的灯火尽数收入其中，上下交映，虚实难辨。</p>
          <p>拍摄倒影构图，有几个关键点值得分享：</p>
          <p><strong>1. 低角度是王道</strong>——越贴近地面，倒影越完整。我通常会把相机放在离地面仅 10-20cm 的位置，使用翻转屏取景。这个角度下，倒影几乎能占据画面一半，视觉冲击力远超正常视角。</p>
          <p><strong>2. 寻找积水区域</strong>——不是所有湿地面都能产生清晰倒影。面积大、表面平整的积水区才是最佳选择。外滩观光平台上的坑洼处往往就是天然的好素材。</p>
          <div class="img-row">
            <img src="https://picsum.photos/seed/blog-rain1/600/400" alt="">
            <img src="https://picsum.photos/seed/blog-rain2/600/400" alt="">
          </div>
          <p><strong>3. 对称与打破对称</strong>——完美对称固然好看，但适当打破对称会更有张力。可以把地平线放在画面三分之一处，让倒影占更大比例，营造超现实的梦幻感。</p>
          <blockquote>「倒影不只是镜像，它是另一个维度的入口。当你学会在水中看世界，每一场雨都是礼物。」</blockquote>
          <p>器材方面，14mm 超广角在这种场景下优势明显，能收纳更完整的倒影。拍摄参数建议 f/8-f/11 确保全景锐利，ISO 尽量压低，配合三脚架长曝光还能让水面更平滑。</p>
        `
      },
      'failed-portrait': {
        title: '一次失败的人像拍摄教会我的事',
        date: '2024.02.28', tag: '人像', section: 'notes',
        cover: 'https://picsum.photos/seed/blog-fail/1200/600',
        body: `
          <p>去年冬天，我接了一组户外人像，结果惨不忍睹。今天复盘，把踩过的坑分享出来，希望你能少走弯路。</p>
          <p><strong>错误一：没有提前踩点</strong>——到了现场才发现「网红打卡点」早已人满为患，根本找不到干净的背景。更糟的是，下午的光线方向和我想象的完全不同，逆光下模特脸部一片死黑。</p>
          <p><strong>错误二：过度引导</strong>——我准备了一堆姿势参考图，拍摄时不断让模特摆这个摆那个，结果成片全是僵硬的「摆拍感」。模特也越拍越紧张，状态越来越差。</p>
          <div class="img-row">
            <img src="https://picsum.photos/seed/blog-fail1/600/400" alt="">
            <img src="https://picsum.photos/seed/blog-fail2/600/400" alt="">
          </div>
          <p><strong>错误三：忽视情绪</strong>——太执着于构图和参数，忘了人像摄影的核心是情绪。一张技术上完美的照片如果毫无情绪，远不如一张略有瑕疵但情感充沛的照片打动人。</p>
          <blockquote>「最好的姿势，是被摄者自己都不知道的那个瞬间。」</blockquote>
          <p>这次之后我学到了：先踩点、少指挥、多聊天、抓瞬间。让拍摄变成一场轻松的散步，而不是紧张的考试。</p>
        `

      'sunrise-sea': {
        title: '凌晨四点的海边，等待日出的那束光',
        date: '2024.01.20', tag: '风景', section: 'notes',
        cover: 'https://picsum.photos/seed/blog-sunrise/1200/600',
        body: `
          <p>凌晨三点半的闹钟，四点到达海边。天空还完全漆黑，只有远处灯塔的微弱光芒。海浪声在暗夜中格外清晰，带着一种催眠般的节奏感。</p>
          <p>架好三脚架，装上滤镜，开始漫长的等待。日出前的「蓝色时刻」是最魔幻的——天际线慢慢泛起一抹深蓝，海面被染成冷调的靛色，远处的云层边缘开始出现微弱的暖色。</p>
          <div class="img-row">
            <img src="https://picsum.photos/seed/blog-sun1/600/400" alt="">
            <img src="https://picsum.photos/seed/blog-sun2/600/400" alt="">
          </div>
          <p>当第一缕阳光刺破云层的那一刻，整片海面像被点燃了。金色、橙色、粉色的光在云层间流转，每一秒都在变化，每一帧都是独一无二的光影。</p>
          <p>我用间隔连拍记录了整个日出过程，从蓝色时刻到金色时刻再到太阳完全升起，大约 40 分钟，拍了 800 多张。最终挑选了 5 张满意的。</p>
          <blockquote>「风光摄影的本质就是等光。你愿意等多久，光就给你多大的惊喜。」</blockquote>
        `
      },
      'skyline': {

        cover: 'https://picsum.photos/seed/blog-skyline/1200/600',
        body: `
          <p>同一个城市，站在不同的高度和角度，会看到完全不同的天际线。这组作品我花了三个月，从地面、楼顶、无人机三个维度拍摄了上海的天际线。</p>

          <p><strong>楼顶视角</strong>——登上高层建筑的观景台，城市在脚下展开。这个视角最有层次感，近处的屋顶、中景的街道、远处的天际线，三层分明。</p>

          <blockquote>「每一座城市都有无数张面孔，你站得越高，看到的越完整。」</blockquote>

          <p><strong>Day 1-2 大理</strong>——洱海环湖是经典路线，但我更推荐清晨的喜洲古镇。白族民居在晨雾中若隐若现，稻田里劳作的农人，这才是真实的大理。</p>

        body: `
          <p>阿里，西藏的西藏，平均海拔 4500 米以上。这里的天空蓝得不像话，光照强度是平原的两倍，是风光摄影师终极朝圣地。</p>
          <p>大环线全程约 1300 公里，我们用了 10 天完成。沿途经过玛旁雍错、冈仁波齐、古格王朝遗址、扎达土林……每一处都值得单独写一篇。</p>

          <p>在阿里拍照最大的挑战不是技术，而是身体。4500 米的海拔下，走路都喘，架三脚架都需要歇好几次。但当你看到银河从冈仁波齐背后升起的时候，一切都值了。</p>

          <p><strong>奈良</strong>——春日大社的石灯笼参道配上落叶，是绝佳的构图素材。鹿群在晨雾中穿行，用 70-200mm 长焦可以拍到非常有故事感的画面。</p>

        `
      },
      'xinjiang': {
        title: '新疆伊犁：六月的薰衣草与雪山',

          <p>六月的伊犁河谷，是薰衣草的海洋。紫色的花海延伸到天际线，背景是终年积雪的天山，这种色彩组合大概只有新疆才有。</p>

        cover: 'https://picsum.photos/seed/blog-lr/1200/600',
